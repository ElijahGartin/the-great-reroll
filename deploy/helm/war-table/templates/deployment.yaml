{{- $appImage := .Values.images.app -}}
{{- $repository := default .Values.image.repository $appImage.repository -}}
{{- $digest := default .Values.image.digest $appImage.digest -}}
{{- $scheduling := .Values.scheduling.default | default .Values.scheduling -}}
{{- $origin := required "publicOrigin must be your external HTTPS origin" .Values.publicOrigin -}}
{{- if not (regexMatch "^https://[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?(:[0-9]{1,5})?$" $origin) -}}
{{- fail "publicOrigin must be an HTTPS origin without a path, credentials, or trailing slash" -}}
{{- end -}}
{{- $port := regexFind ":[0-9]+$" $origin -}}
{{- if $port -}}
{{- $number := trimPrefix ":" $port | int -}}
{{- if or (lt $number 1) (gt $number 65535) -}}
{{- fail "publicOrigin port must be between 1 and 65535" -}}
{{- end -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "war-table.name" . }}
  labels:
    {{- include "war-table.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "war-table.labels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "war-table.labels" . | nindent 8 }}
    spec:
      {{- with $scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $scheduling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $scheduling.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: war-table
          image: {{ printf "%s%s" $repository (ternary (printf "@%s" $digest) (printf ":%s" .Values.image.tag) (not (empty $digest))) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /data
            - name: PUBLIC_ORIGIN
              value: {{ $origin | quote }}
            - name: ROOM_TTL_DAYS
              value: {{ .Values.roomTtlDays | quote }}
            - name: MAX_ROOMS
              value: {{ .Values.maxRooms | quote }}
            - name: MAX_COMMANDS_PER_ROOM
              value: {{ .Values.maxCommandsPerRoom | quote }}
            - name: MAX_BODY_BYTES
              value: {{ .Values.maxBodyBytes | quote }}
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.rateLimitPerMinute | quote }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "war-table.claim" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
