{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required" .Values.ingress.host -}}
{{- if ne .Values.publicOrigin (printf "https://%s" $host) -}}
{{- fail "publicOrigin must match https://ingress.host when ingress is enabled" -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "war-table.name" . }}
  labels:
    {{- include "war-table.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ required "ingress.tlsSecretName is required" .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "war-table.name" . }}
                port: {name: http}
{{- end }}
